<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Random Quote Generator</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      font-family: 'Arial', sans-serif;
      background: linear-gradient(to right, #6a11cb, #2575fc);
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      transition: background 0.5s ease;
    }

    .container {
      text-align: center;
      background: rgba(0, 0, 0, 0.6);
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.4);
      max-width: 500px;
      width: 90%;
      transition: transform 0.3s ease;
    }

    .container:hover {
      transform: scale(1.02);
    }

    h1 {
      margin-bottom: 20px;
      font-size: 2rem;
    }

    .quote-box {
      margin: 20px 0;
      font-size: 1.2rem;
      min-height: 70px;
      line-height: 1.5;
    }

    #author {
      display: block;
      margin-top: 10px;
      font-style: italic;
      font-size: 1rem;
      opacity: 0.8;
    }

    button {
      background-color: #ff5722;
      color: #fff;
      border: none;
      padding: 12px 25px;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    button:hover {
      background-color: #e64a19;
      transform: scale(1.05);
    }

    @media (max-width: 500px) {
      h1 {
        font-size: 1.5rem;
      }
      .quote-box {
        font-size: 1rem;
      }
      button {
        padding: 10px 20px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Random Quote Generator</h1>
    <div class="quote-box">
      <p id="quote">"Click the button to get a quote."</p>
      <span id="author"></span>
    </div>
    <button id="btn">Get Quote</button>
  </div>

  <!-- Make sure script.js is in the same folder -->
  <script src="script.js"></script>
</body>
</html>
